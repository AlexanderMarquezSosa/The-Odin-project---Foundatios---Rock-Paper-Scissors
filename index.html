<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Rock Paper Scissors</title>
</head>
    <script>

        var humanScore=0;
        var computerScore=0;
        var round=0;

        function getComputerChoice(){
            var random =Math.floor(Math.random()*3);
            switch(random){
                case 1: return 'rock'
                break;
                case 2: return'paper'
                break;
                default:return 'scissors'                
             }
        }

        function getHumanChoice(){
            const choice = prompt('Welcome to Project: Rock Paper Scissors -  Please enter your choice (rock-paper-scissors)');
            return choice.toLocaleLowerCase();
        }

        function checkScore(){
            if(humanScore> computerScore){
                return `HUMAN WIN!!!`
            }else if(humanScore> computerScore){
                return `COMPUTER WIN!!!`
            }else{
                return `DRAW GAME--- PLAY AGAIN!!!`
            }
        }

        function playGame(){
            function playRound(humaChoice,computerChoise){
            //draw
            if(humaChoice === computerChoise){
                round++
                return `Round:${round} - Human choice: ${humaChoice} vs Computer Choice: ${computerChoise}\nDraw game - Try again \nScore: ${humanScore} - ${computerScore}`;
                //huma lose
            }else if(humaChoice==='paper' && computerChoise ==='scissors'){
                computerScore++;
                round++;
                return `Round:${round} - Human choice: ${humaChoice} vs Computer Choice: ${computerChoise}\nComputer Win - You Lose \nScore: ${humanScore} - ${computerScore}`;
                 
            }else if(humaChoice==='rock' && computerChoise ==='paper'){
                computerScore++;
                round++;
                return `Round:${round} - Human choice: ${humaChoice} vs Computer Choice: ${computerChoise}\nComputer Win - You Lose \nScore: ${humanScore} - ${computerScore}`;
            }else if(humaChoice==='scissor' && computerChoise ==='rock'){
                computerScore++;
                round++;
                return `Round:${round} - Human choice: ${humaChoice} vs Computer Choice: ${computerChoise}\nComputer Win - You Lose \nScore: ${humanScore} - ${computerScore}`;
                
                //huma win
            }else if(humaChoice==='rock' && computerChoise ==='scissors'){
                humanScore++;
                round++;
                return `Round:${round} - Human choice: ${humaChoice} vs Computer Choice: ${computerChoise}\nHuman Win - You Win \nScore: ${humanScore} - ${computerScore}`;
                
            }else if(~(humaChoice==='scissors' && computerChoise ==='paper')){
                humanScore++;
                round++;
                return `Round:${round} - Human choice: ${humaChoice} vs Computer Choice: ${computerChoise}\nHuman Win - You Win \nScore ${humanScore} - ${computerScore}`;
                
            }else if(~(humaChoice==='paper' && computerChoise ==='rock')){
                humanScore++;
                round++;
                return `Round:${round} - Human choice: ${humaChoice} vs Computer Choice: ${computerChoise}\nHuman Win - You Win \nScore: ${humanScore} - ${computerScore}`;              
            }
        }
         
        while(humanScore>=3 ||computerScore>=3 || round<5){
            const humanSelection = getHumanChoice();
            const computerSelection = getComputerChoice();

            console.log(playRound(humanSelection,computerSelection))

            if(humanScore>=3 ||computerScore >=3 || round>4){
                console.log(checkScore())
            }
        }
    }
        playGame()
    </script>
