<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=BBH+Bogle&family=Bitcount+Prop+Single:wght@100..900&family=Geomini:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@300..700&family=VT323&display=swap" rel="stylesheet">
</head>
<body> 
<div class="general-container">

    <div class="title">   
        <h1>Rock Paper Scissors Game</h1>
        <h2>by The odin Project</h2>
    </div>

    <div class="score">
        <div class="round" id="roundGeneral">Round:</div>
        <div class="huma_score" id="humaScore">Player:</div>
        <div class="compute_score" id="computerScore">Computer:</div>
    </div>
    <div class="play" id="play_container">
        <h1 id="text1">Start the game</h1>
        <h2 id="text2">Click in the button</h2>
        <button><img src="img/play.png" alt="play" id="play"></button>
    </div>
    

</div>
<dialog id="modal">
    <h1>Select your choice</h2>
    <div class="choise-container" id="choiseContainer">
        
        <button><img src="img/rock.png" alt="Rock" id="op1"></button>
        <button><img src="img/paper.png" alt="Paper" id="op2"></button>
        <button><img src="img/scissors.png" alt="Scissor" id="op3"></button>
    </div>
</dialog>
</body>
<script src="rockPaperScissors.js"></script>
</html>
